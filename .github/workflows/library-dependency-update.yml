name: TAF Library Dependency Update

on:
  repository_dispatch:
    types:
      - taf-library-published

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taf-library-update-production
  cancel-in-progress: false

env:
  PACKAGE_ID: TAF.Library
  LIBRARY_REPO: rudy-co/RPA.TAF.Library
  LIBRARY_REPO_NAME: RPA.TAF.Library
  LIBRARY_DIR: taf-library
  CONSUMER_DIR: consumer
  TARGET_BRANCH: Production

jobs:
  update-and-validate:
    name: Update and Validate TAF.Library Dependency
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.client_payload.package == 'TAF.Library'

    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # =========================================================
      # STEP 0: Create GitHub App token
      # One short-lived token (1 hour) for both the library repo
      # (read) and this consumer repo (push branch + open PR).
      # Both repos must be under the same owner and the App must
      # be installed on both.
      # =========================================================
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ env.LIBRARY_REPO_NAME }}
            ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # =========================================================
      # STEP 1: Verify access to the library repository
      # =========================================================
      - name: Verify library repository access
        shell: pwsh
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:APP_TOKEN)) {
            throw "GitHub App token was not created. Check the BOT_APP_ID and BOT_PRIVATE_KEY secrets."
          }

          $headers = @{
            Authorization          = "Bearer $env:APP_TOKEN"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          try {
            $repo = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:LIBRARY_REPO" -Headers $headers
          }
          catch {
            throw "The GitHub App cannot access '$env:LIBRARY_REPO'. Check that the App is installed on that repository and has 'Contents: Read'. Details: $($_.Exception.Message)"
          }

          Write-Host "Library repository : $($repo.full_name)"
          Write-Host "Default branch     : $($repo.default_branch)"

      # =========================================================
      # STEP 2: Checkout library release
      # =========================================================
      - name: Checkout TAF.Library release
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LIBRARY_REPO }}
          ref: ${{ github.event.client_payload.ref || 'Production' }}
          token: ${{ steps.app-token.outputs.token }}
          path: ${{ env.LIBRARY_DIR }}
          sparse-checkout: project.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # =========================================================
      # STEP 3: Read and validate library version
      # =========================================================
      - name: Validate library release metadata
        id: library
        shell: pwsh
        env:
          EVENT_VERSION: ${{ github.event.client_payload.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $file = Join-Path $env:LIBRARY_DIR 'project.json'

          if (-not (Test-Path $file)) {
            throw "Library project.json was not found: $file"
          }

          try {
            $library = Get-Content $file -Raw | ConvertFrom-Json
          }
          catch {
            throw "Library project.json is invalid JSON: $($_.Exception.Message)"
          }

          if ($library.name -ne $env:PACKAGE_ID) {
            throw "Expected library '$env:PACKAGE_ID', but found '$($library.name)'."
          }

          $version = "$($library.projectVersion)".Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid library projectVersion '$version'. Expected MAJOR.MINOR.PATCH."
          }

          if (
            $env:GITHUB_EVENT_NAME -eq 'repository_dispatch' -and
            -not [string]::IsNullOrWhiteSpace($env:EVENT_VERSION)
          ) {
            if ($version -ne $env:EVENT_VERSION) {
              throw "Release mismatch. Dispatch version='$env:EVENT_VERSION'; project.json version='$version'."
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT

          Write-Host "Library package : $env:PACKAGE_ID"
          Write-Host "Library version : $version"

      # =========================================================
      # STEP 4: Checkout full consumer repository
      # =========================================================
      - name: Checkout consumer Production branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: ${{ env.CONSUMER_DIR }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # =========================================================
      # STEP 5: Validate consumer dependency and compare versions
      # =========================================================
      - name: Validate consumer dependency
        id: check
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ steps.library.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $file = Join-Path $env:CONSUMER_DIR 'project.json'

          if (-not (Test-Path $file)) {
            throw "Consumer project.json was not found: $file"
          }

          try {
            $project = Get-Content $file -Raw | ConvertFrom-Json
          }
          catch {
            throw "Consumer project.json is invalid JSON: $($_.Exception.Message)"
          }

          if (-not $project.dependencies) {
            throw "Consumer project.json does not contain a dependencies object."
          }

          $dependency = $project.dependencies.PSObject.Properties[$env:PACKAGE_ID]

          if (-not $dependency) {
            throw "Dependency '$env:PACKAGE_ID' is not declared in consumer project.json."
          }

          $currentRaw = "$($dependency.Value)".Trim()

          # This workflow expects an exact dependency version:
          # [1.2.3]
          # Version ranges require separate handling.
          if ($currentRaw -notmatch '^\[\s*\d+\.\d+\.\d+\s*\]$') {
            throw "Unsupported dependency version '$currentRaw'. Expected an exact version such as '[1.2.3]'."
          }

          $current = $currentRaw.Trim('[', ']', ' ')
          $requested = $env:REQUESTED_VERSION

          $currentVersion = [version]$current
          $requestedVersion = [version]$requested

          $updateRequired = $false
          $reason = ''

          if ($requestedVersion -gt $currentVersion) {
            $updateRequired = $true
            $reason = 'A newer library version is available.'
          }
          elseif ($requestedVersion -eq $currentVersion) {
            $reason = 'Consumer already uses the requested version.'
          }
          else {
            $reason = 'Consumer dependency is newer than requested. Downgrade is blocked.'
          }

          "current-version=$current" >> $env:GITHUB_OUTPUT
          "requested-version=$requested" >> $env:GITHUB_OUTPUT
          "update-required=$($updateRequired.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          Write-Host "Current version   : $current"
          Write-Host "Requested version : $requested"
          Write-Host "Update required   : $updateRequired"
          Write-Host "Decision          : $reason"

          @"
          ## TAF.Library Dependency Check

          | Item | Value |
          |---|---|
          | Consumer repository | $env:GITHUB_REPOSITORY |
          | Target branch | $env:TARGET_BRANCH |
          | Current version | $current |
          | Requested version | $requested |
          | Update required | $updateRequired |
          | Decision | $reason |
          "@ >> $env:GITHUB_STEP_SUMMARY

      # =========================================================
      # STEP 6: Update dependency in project.json
      # =========================================================
      - name: Update library dependency
        if: steps.check.outputs.update-required == 'true'
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ steps.check.outputs.requested-version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $file = Join-Path $env:CONSUMER_DIR 'project.json'

          $project = Get-Content $file -Raw | ConvertFrom-Json

          $dependency = $project.dependencies.PSObject.Properties[$env:PACKAGE_ID]

          if (-not $dependency) {
            throw "Dependency '$env:PACKAGE_ID' was not found before update."
          }

          # Set the exact dependency version.
          $project.dependencies.($env:PACKAGE_ID) = "[$env:REQUESTED_VERSION]"

          $json = $project | ConvertTo-Json -Depth 100

          # Validate JSON before saving.
          try {
            $null = $json | ConvertFrom-Json
          }
          catch {
            throw "Generated project.json is invalid: $($_.Exception.Message)"
          }

          # Write UTF-8 without BOM.
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          [System.IO.File]::WriteAllText(
            $file,
            $json + [Environment]::NewLine,
            $utf8NoBom
          )

          # Verify the saved dependency.
          $saved = Get-Content $file -Raw | ConvertFrom-Json
          $savedDependency = $saved.dependencies.PSObject.Properties[$env:PACKAGE_ID]

          if ($savedDependency.Value -ne "[$env:REQUESTED_VERSION]") {
            throw "Dependency update verification failed."
          }

          Write-Host "Updated $env:PACKAGE_ID to [$env:REQUESTED_VERSION]."

      # =========================================================
      # STEP 7: Validate updated project metadata
      # =========================================================
      - name: Validate updated project files
        if: steps.check.outputs.update-required == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $projectDir = Join-Path $env:GITHUB_WORKSPACE $env:CONSUMER_DIR
          $projectFile = Join-Path $projectDir 'project.json'

          if (-not (Test-Path $projectFile)) {
            throw "Consumer project.json is missing."
          }

          try {
            $project = Get-Content $projectFile -Raw | ConvertFrom-Json
          }
          catch {
            throw "Consumer project.json is invalid JSON: $($_.Exception.Message)"
          }

          if ([string]::IsNullOrWhiteSpace("$($project.name)")) {
            throw "Consumer project name is missing."
          }

          if ([string]::IsNullOrWhiteSpace("$($project.projectVersion)")) {
            throw "Consumer projectVersion is missing."
          }

          if (-not $project.dependencies) {
            throw "Consumer dependencies object is missing."
          }

          $dependency = $project.dependencies.PSObject.Properties[$env:PACKAGE_ID]

          if (-not $dependency) {
            throw "Dependency '$env:PACKAGE_ID' is missing."
          }

          Write-Host "Consumer project name    : $($project.name)"
          Write-Host "Consumer project version : $($project.projectVersion)"
          Write-Host "$env:PACKAGE_ID dependency : $($dependency.Value)"
          Write-Host "Project metadata validation passed."

      # =========================================================
      # STEP 8: Setup Node.js
      # =========================================================
      - name: Setup Node.js
        if: steps.check.outputs.update-required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # =========================================================
      # STEP 9a: Install UiPath CLI and RPA tool
      # =========================================================
      - name: Install UiPath CLI
        if: steps.check.outputs.update-required == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          npm install --global @uipath/cli@1.202.1

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install UiPath CLI."
          }

          uip --version

          if ($LASTEXITCODE -ne 0) {
            throw "UiPath CLI is not available."
          }

          uip tools install rpa

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the UiPath RPA tool."
          }

      # =========================================================
      # STEP 9b: Log in to UiPath so restore can use the
      # tenant Orchestrator library feed (where TAF.Library lives)
      # =========================================================
      - name: Log in to UiPath Orchestrator
        if: steps.check.outputs.update-required == 'true'
        shell: pwsh
        env:
          UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
          UIPATH_TENANT: ${{ vars.UIPATH_TENANT }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:UIPATH_CLIENT_ID) -or
              [string]::IsNullOrWhiteSpace($env:UIPATH_CLIENT_SECRET)) {
            throw "UIPATH_CLIENT_ID / UIPATH_CLIENT_SECRET secrets are not set."
          }

          # env.NAME makes uip read the value from the environment,
          # so the secret never appears on the command line.
          uip login `
            --client-id env.UIPATH_CLIENT_ID `
            --client-secret env.UIPATH_CLIENT_SECRET `
            --tenant "$env:UIPATH_TENANT" `
            --scope "OR.Execution.Read" `
            --output json

          if ($LASTEXITCODE -ne 0) {
            throw "UiPath login failed. Check the external app credentials, scopes and tenant name."
          }

          uip login status --output json

      # =========================================================
      # STEP 10: Restore dependencies
      # =========================================================
      - name: Restore UiPath project dependencies
        if: steps.check.outputs.update-required == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $projectDir = Join-Path $env:GITHUB_WORKSPACE $env:CONSUMER_DIR

          Push-Location $projectDir
          try {
            uip rpa restore .

            if ($LASTEXITCODE -ne 0) {
              throw "UiPath dependency restore failed."
            }
          }
          finally {
            Pop-Location
          }

      # =========================================================
      # STEP 11: Pack consumer project
      # =========================================================
      - name: Pack UiPath consumer project
        if: steps.check.outputs.update-required == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $projectDir = Join-Path $env:GITHUB_WORKSPACE $env:CONSUMER_DIR
          $outputDir = Join-Path $env:RUNNER_TEMP 'uipath-package'

          New-Item -ItemType Directory -Path $outputDir -Force |
            Out-Null

          Push-Location $projectDir
          try {
            uip rpa pack . $outputDir --output-type Process

            if ($LASTEXITCODE -ne 0) {
              throw "UiPath package creation failed."
            }
          }
          finally {
            Pop-Location
          }

          $packages = Get-ChildItem $outputDir -Filter '*.nupkg'

          if (-not $packages) {
            throw "Pack command completed but no .nupkg was produced."
          }

          Write-Host "Generated packages:"
          $packages | ForEach-Object {
            Write-Host " - $($_.FullName)"
          }

      # =========================================================
      # STEP 12: Create Pull Request to Production
      # A PR opened with the App token (unlike github.token) also
      # triggers the consumer's own CI checks.
      # =========================================================
      - name: Create dependency update pull request
        if: steps.check.outputs.update-required == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: ${{ env.CONSUMER_DIR }}
          branch: automation/update-taf-library-${{ steps.library.outputs.version }}
          base: ${{ env.TARGET_BRANCH }}
          delete-branch: true
          add-paths: |
            project.json
          commit-message: "chore(deps): update TAF.Library to ${{ steps.library.outputs.version }}"
          title: "chore(deps): update TAF.Library to ${{ steps.library.outputs.version }}"
          body: |
            ## Summary

            Automated dependency update for `TAF.Library`.

            | Item | Value |
            |---|---|
            | Package | `TAF.Library` |
            | Previous version | `${{ steps.check.outputs.current-version }}` |
            | New version | `${{ steps.library.outputs.version }}` |
            | Target branch | `${{ env.TARGET_BRANCH }}` |

            ## Validation

            - [x] Library release metadata validated
            - [x] Consumer dependency updated
            - [x] Consumer project metadata validated
            - [x] Dependency restore completed
            - [x] Consumer package creation completed

            Please review the dependency change before merging.

      # =========================================================
      # STEP 13: Report when no update is required
      # =========================================================
      - name: Report skipped update
        if: steps.check.outputs.update-required != 'true'
        shell: pwsh
        env:
          CURRENT_VERSION: ${{ steps.check.outputs.current-version }}
          REQUESTED_VERSION: ${{ steps.check.outputs.requested-version }}
        run: |
          @"
          ## Dependency Update Skipped

          `TAF.Library` does not require an update.

          - Current consumer version: $env:CURRENT_VERSION
          - Requested library version: $env:REQUESTED_VERSION

          No pull request was created.
          "@ >> $env:GITHUB_STEP_SUMMARY

          Write-Host "No dependency update was performed."
