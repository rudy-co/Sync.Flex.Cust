name: Publish UiPath Project After PR Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - Production

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  UIPATH_CLI_VERSION: "1.202.1"
  PROJECT_FILE: "project.json"
  OUTPUT_DIR: "dist"

jobs:
  publish:
    name: Validate, Pack and Publish

    # Run the workflow only if the pull request has been merged.
    if: github.event.pull_request.merged == true

    runs-on: windows-latest

    # Use the production GitHub Environment.
    environment: uipath-prod

    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # STEP 1: Check out the Production branch after merge
      # --------------------------------------------------
      - name: Checkout Production
        uses: actions/checkout@v4
        with:
          ref: Production
          fetch-depth: 0

      # --------------------------------------------------
      # STEP 2: Validate project.json
      # --------------------------------------------------
      - name: Validate project.json
        id: project
        shell: pwsh
        run: |
          $projectFile = Join-Path $PWD $env:PROJECT_FILE

          if (-not (Test-Path $projectFile)) {
            throw "The project.json file was not found: $projectFile"
          }

          $project = Get-Content $projectFile -Raw |
            ConvertFrom-Json

          if ([string]::IsNullOrWhiteSpace([string]$project.name)) {
            throw "The 'name' property is missing from project.json."
          }

          if ([string]::IsNullOrWhiteSpace([string]$project.projectVersion)) {
            throw "The 'projectVersion' property is missing from project.json."
          }

          $version = [string]$project.projectVersion

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid projectVersion format: $version"
          }

          "name=$($project.name)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

          Write-Host "Project name    : $($project.name)"
          Write-Host "Project version : $version"

      # --------------------------------------------------
      # STEP 3: Validate the TAF.Library dependency
      # --------------------------------------------------
      - name: Validate TAF.Library dependency
        shell: pwsh
        run: |
          $projectFile = Join-Path $PWD $env:PROJECT_FILE

          $project = Get-Content $projectFile -Raw |
            ConvertFrom-Json

          $packageId = "TAF.Library"

          $dependencyProperty =
            $project.dependencies.PSObject.Properties[$packageId]

          if ($null -eq $dependencyProperty) {
            throw "The '$packageId' dependency was not found in project.json."
          }

          $dependencyVersion = [string]$dependencyProperty.Value

          Write-Host "Dependency : $packageId"
          Write-Host "Version    : $dependencyVersion"

          if ($dependencyVersion -notmatch '^\[\d+\.\d+\.\d+\]$') {
            throw "The '$packageId' dependency must use an exact version format, such as [1.2.3]. Current value: $dependencyVersion"
          }

          Write-Host "Dependency version format is valid."

      # --------------------------------------------------
      # STEP 4: Set up Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --------------------------------------------------
      # STEP 5: Install UiPath CLI
      # --------------------------------------------------
      - name: Install UiPath CLI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.npm-global"

          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.npm-global/bin:$PATH"

          npm install -g "@uipath/cli@${UIPATH_CLI_VERSION}"

          uip --version

      # --------------------------------------------------
      # STEP 6: Authenticate with UiPath
      # --------------------------------------------------
      - name: Authenticate to UiPath
        shell: bash
        env:
          UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
          UIPATH_ORG: ${{ vars.UIPATH_ORG }}
          UIPATH_TENANT: ${{ vars.UIPATH_TENANT }}
          UIPATH_URL: ${{ vars.UIPATH_URL || 'https://cloud.uipath.com' }}
          UIPATH_SCOPE: ${{ vars.UIPATH_SCOPE || 'OR.Execution OR.Folders.Read' }}
        run: |
          set -euo pipefail

          for v in UIPATH_CLIENT_ID UIPATH_CLIENT_SECRET UIPATH_ORG UIPATH_TENANT; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is empty in environment 'uipath-prod'"
              exit 1
            fi
          done

          uip login --authority "$UIPATH_URL" \
            --organization "$UIPATH_ORG" \
            --tenant "$UIPATH_TENANT" \
            --client-id "$UIPATH_CLIENT_ID" \
            --client-secret "$UIPATH_CLIENT_SECRET" \
            --scope "$UIPATH_SCOPE" \
            --output json

          uip login status --output json

      # --------------------------------------------------
      # STEP 7: Restore, build and pack the UiPath project
      # --------------------------------------------------
      - name: Pack UiPath project
        id: pack
        shell: bash
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
        run: |
          set -euo pipefail

          # Pack output must be OUTSIDE the project folder.
          OUT="$RUNNER_TEMP/$OUTPUT_DIR"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # Restore dependencies (including TAF.Library) from the Orchestrator feeds.
          uip rpa restore .

          # Positional arguments: <project-dir> <output-dir>
          uip rpa pack . "$OUT" \
            --package-version "$PROJECT_VERSION" \
            --skip-analyze \
            --output json

          mapfile -t PACKAGES < <(find "$OUT" -type f -name "*.nupkg")

          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .nupkg package, but found ${#PACKAGES[@]}."
            ls -la "$OUT"
            exit 1
          fi

          NUPKG="${PACKAGES[0]}"

          # Make sure the package carries the version from project.json.
          if [[ "$(basename "$NUPKG")" != *".${PROJECT_VERSION}.nupkg" ]]; then
            echo "::error::Package $(basename "$NUPKG") does not match version $PROJECT_VERSION."
            exit 1
          fi

          echo "Generated package: $NUPKG"
          echo "nupkg=$NUPKG" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # STEP 8: Upload the package to UiPath Orchestrator
      # --------------------------------------------------
      - name: Publish package to Orchestrator
        shell: bash
        env:
          NUPKG: ${{ steps.pack.outputs.nupkg }}
        run: |
          set -euo pipefail

          if [ ! -f "$NUPKG" ]; then
            echo "::error::Package not found: $NUPKG"
            exit 1
          fi

          echo "Uploading $(basename "$NUPKG") to Orchestrator..."

          RC=0
          RESULT=$(uip or packages upload "$NUPKG" --output json 2>&1) || RC=$?
          echo "$RESULT"

          if [ "$RC" -ne 0 ]; then
            # A re-run after a successful upload should not fail the pipeline.
            if echo "$RESULT" | grep -qiE "already exist|conflict"; then
              echo "::warning::$(basename "$NUPKG") already exists in Orchestrator, skipping upload."
            else
              echo "::error::Package upload failed (exit $RC)."
              exit "$RC"
            fi
          fi

          echo "Uploaded $(basename "$NUPKG") to Orchestrator" >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------
      # STEP 9: Generate the workflow summary
      # --------------------------------------------------
      - name: Publish summary
        if: success()
        shell: pwsh
        env:
          PROJECT_NAME: ${{ steps.project.outputs.name }}
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          @"
          ## UiPath Package Published

          - Repository: $env:GITHUB_REPOSITORY
          - Project: $env:PROJECT_NAME
          - Project version: $env:PROJECT_VERSION
          - Branch: Production
          - Pull Request: #$env:PR_NUMBER
          - Environment: uipath-prod
          - Status: Published
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
